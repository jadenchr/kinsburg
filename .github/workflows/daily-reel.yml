# Records the daily Kinsburg Reels from the live city and posts them to @kinsburgtown.
# 13:17 UTC: the rotating daily series. 19:17 UTC: "Built today", the things built that day from
# comment requests (falls back to resident-of-the-day when nothing was built). Off the top of the
# hour, when GitHub's scheduler is less busy. Or by hand from the Actions tab ("Run workflow").
# Needs the repository secret ADMIN_TOKEN and the variable KINSBURG_URL. The Instagram token stays in
# Cloudflare: the post goes through the Worker. Until Instagram is connected there, it records only
# and keeps the MP4 as a downloadable artifact.
name: Daily reel

on:
  schedule:
    - cron: '17 13 * * *'
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      evening:
        description: 'Record the evening "Built today" Reel'
        type: boolean
        default: false
      dry_run:
        description: 'Record only, do not post'
        type: boolean
        default: true
      hour:
        description: 'Time of day, e.g. 21.5, or a time-lapse range like 18.2-21.7 (blank = default)'
        required: false

concurrency: { group: daily-reel, cancel-in-progress: false }

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KINSBURG_URL: ${{ vars.KINSBURG_URL }}
      REEL_SERIES: ${{ (github.event.schedule == '17 19 * * *' || inputs.evening) && 'built-today' || '' }}
      REEL_SLOT: ${{ (github.event.schedule == '17 19 * * *' || inputs.evening) && 'evening' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check Chrome
        run: google-chrome --version
      - name: Record
        run: |
          ARGS=""
          if [ -n "${{ inputs.hour }}" ]; then ARGS="--hour ${{ inputs.hour }}"; fi
          if [ -z "$KINSBURG_URL" ]; then npx vite build; fi
          node scripts/reel/record.mjs $ARGS ${KINSBURG_URL:+--url "$KINSBURG_URL"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: out/
          retention-days: 14
      - name: Publish to Instagram
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ] || [ -z "$KINSBURG_URL" ]; then
            echo "ADMIN_TOKEN or KINSBURG_URL not set yet: recorded only (see the reel artifact)."
            node scripts/reel/publish.mjs
          else
            node scripts/reel/publish.mjs --publish
          fi
